; Balise MbënnScan — ESP32 + capteur à ultrasons étanche
; Compiler :  pio run -e jsn_sr04t   (ou -e a02yyuw)
; Flasher  :  pio run -e jsn_sr04t -t upload && pio device monitor

[platformio]
default_envs = jsn_sr04t

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=0

; JSN-SR04T : broches TRIG / ECHO
[env:jsn_sr04t]
build_flags = ${env.build_flags} -DCAPTEUR_TRIG_ECHO

; A02YYUW : sortie série (UART) 9600 bauds
[env:a02yyuw]
build_flags = ${env.build_flags} -DCAPTEUR_UART
